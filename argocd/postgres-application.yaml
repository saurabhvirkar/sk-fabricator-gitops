apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skfabricator-postgres-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/saurabhvirkar/sk-fabricator-gitops.git'
    targetRevision: HEAD
    path: helm/postgres
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
