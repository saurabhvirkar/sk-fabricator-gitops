apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skfabricator-backend-stage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: skfabricator-stage
  source:
    repoURL: 'https://github.com/saurabhvirkar/sk-fabricator-gitops.git'
    targetRevision: main
    path: charts/backend
    helm:
      valueFiles:
        - '../../environments/stage/backend-values.yaml'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: sk-fabricator-stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
