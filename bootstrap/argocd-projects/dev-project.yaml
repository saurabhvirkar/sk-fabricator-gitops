apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: skfabricator-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Development environment project for SK Fabricator
  sourceRepos:
    - 'https://github.com/saurabhvirkar/sk-fabricator-gitops.git'
  destinations:
    - namespace: sk-fabricator-dev
      server: 'https://kubernetes.default.svc'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
