apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: skfabricator-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Production environment project for SK Fabricator with restricted scope
  sourceRepos:
    - 'https://github.com/saurabhvirkar/sk-fabricator-gitops.git'
  destinations:
    - namespace: sk-fabricator-prod
      server: 'https://kubernetes.default.svc'
  namespaceResourceWhitelist:
    - group: 'apps'
      kind: Deployment
    - group: 'apps'
      kind: StatefulSet
    - group: ''
      kind: Service
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: PersistentVolumeClaim
    - group: 'networking.k8s.io'
      kind: Ingress
    - group: 'networking.k8s.io'
      kind: NetworkPolicy
    - group: 'autoscaling'
      kind: HorizontalPodAutoscaler
    - group: 'policy'
      kind: PodDisruptionBudget
