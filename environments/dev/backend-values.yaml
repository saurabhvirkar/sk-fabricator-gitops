replicaCount: 1

image:
  repository: skfabricator-backend
  pullPolicy: IfNotPresent
  tag: "latest"

autoscaling:
  enabled: false

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

env:
  ASPNETCORE_ENVIRONMENT: "Development"
  ALLOWED_ORIGINS: "http://localhost:4200,http://skfabricator.local,http://localhost"
