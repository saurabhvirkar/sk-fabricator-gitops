replicaCount: 3

image:
  tag: "prod"

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

env:
  ASPNETCORE_ENVIRONMENT: "Production"
  ALLOWED_ORIGINS: "https://skfabricator.com"
