replicaCount: 1

image:
  repository: saurabhvirkar/skfabricator-frontend
  tag: "1.0.0"

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: prod.skfabricator.local
      paths:
        - path: /
          pathType: Prefix
    - host: skfabricator.com
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

configMap:
  data:
    API_URL: "http://api.prod.skfabricator.local"
    ENVIRONMENT: "production"

